# Site settings
title: Event Sentinel Documentation
description: Complete documentation for Event Sentinel - A professional Discord event logging bot
# Update these URLs to match your GitHub Pages setup
# For user/organization pages: url: https://username.github.io, baseurl: ""
# For project pages: url: https://username.github.io, baseurl: "/repository-name"
url: https://hugsndnugs.github.io
baseurl: /Event-Sentinel

# Theme settings
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme

# Color scheme: "light" (default), "dark", or "auto"
# Note: "auto" may require local SCSS files; using "light" for compatibility
color_scheme: dark

# Search
search_enabled: true
search:
  heading_level: 2

# Aux links for the upper right navigation
aux_links:
  "Event Sentinel on GitHub":
    - "https://github.com/hugsndnugs/Event-Sentinel"

# Footer content
footer_content: "Event Sentinel Documentation - Last updated: <time datetime='2025-11-25T00:00:00Z'>November 2025</time>"

# GitHub repository
github:
  repository_url: https://github.com/hugsndnugs/Event-Sentinel

# Logo
logo: "/assets/images/logo.png"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

